<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% for error in field.errors %}<p class="field-error" id="{{ field.id_for_label }}_error">{% include "partials/icon.html" with name="alert" size="sm" %}<span>{{ error }}</span></p>{% endfor %}
  {% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}
</div>
