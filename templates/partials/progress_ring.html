{% load l10n %}<svg class="ring" viewBox="0 0 80 80" width="88" height="88" role="img" aria-label="Bugünün ilerlemesi %{{ percent }}" data-ring>
  <circle class="ring-track" cx="40" cy="40" r="34" fill="none" stroke-width="8"/>
  <circle class="ring-value" cx="40" cy="40" r="34" fill="none" stroke-width="8"
          stroke-linecap="round" transform="rotate(-90 40 40)" stroke-dasharray="213.63" stroke-dashoffset="{{ ring_offset|unlocalize }}" data-ring-value data-percent="{{ percent }}"/>
  <text x="40" y="45" text-anchor="middle" class="ring-text" data-ring-text>%{{ percent }}</text>
</svg>
